name: CI

# Tier 1 of the two-tier plan (TECH_DEBT X1): build the extension, lint, and run
# every test that does not need the ~340 MB fixture corpus, on each PR and push.
#
# The corpus lives at <workspace>/test_files, outside this repo. Its absence
# makes fixture tests SKIP rather than fail (CLAUDE.md §1 calls this out as a
# quiet breakage), so the "assert the suite really ran" step below fails the job
# if the collected count collapses — a green tick on an empty run is worse than
# a red one.

on:
  pull_request:
  push:
    branches: [main, master, trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build · pylint · pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # abi3-py39: one wheel covers 3.9+, so the ends of the supported range
        # are what actually need proving.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install tooling
        run: python -m pip install --upgrade pip maturin pytest pylint openpyxl

      - name: Build the extension
        run: maturin develop --release

      - name: Import smoke test
        run: python -c "import py_chunks; print(py_chunks.__file__); assert len(py_chunks.__all__) > 40"

      - name: pylint (must stay 10.00/10)
        run: python -m pylint py_chunks

      - name: pytest
        run: python -m pytest -q --junitxml=pytest.xml

      - name: Assert the suite actually ran
        # Without the corpus most fixture tests skip. That is expected here, but
        # a run that collects almost nothing means the suite silently evaporated.
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET, sys
          r = ET.parse("pytest.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          total = int(s.get("tests", 0)); failures = int(s.get("failures", 0))
          errors = int(s.get("errors", 0)); skipped = int(s.get("skipped", 0))
          ran = total - skipped
          print(f"collected={total} ran={ran} skipped={skipped} failures={failures} errors={errors}")
          if failures or errors:
              sys.exit("test failures")
          if ran < 200:
              sys.exit(f"only {ran} tests actually ran — the suite collapsed, not passed")
          PY
