name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Wheels are built with pyo3's `abi3-py39` feature (see Cargo.toml): each
# platform gets ONE stable-ABI wheel (cp39-abi3) that covers CPython 3.9+.
# The single `python-version: "3.13"` below is only the interpreter maturin
# builds against — the produced wheel installs on 3.9 through 3.13+.
jobs:

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            target: aarch64-apple-darwin
          - os: macos-15-intel    # Intel (macos-13 retired Dec 2025)
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out target/wheels

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: target/wheels

  # ── Linux x86_64 ───────────────────────────────────────────────────────────
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64-unknown-linux-gnu
          manylinux: "2_28"
          args: --release --out target/wheels

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: target/wheels

  # ── Linux aarch64 ──────────────────────────────────────────────────────────
  build-linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: aarch64-unknown-linux-gnu
          manylinux: "2_28"
          args: --release --out target/wheels

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64
          path: target/wheels

  # ── Test the built wheel ───────────────────────────────────────────────────
  test-linux:
    name: Test wheel (Linux x86_64, Python 3.11)
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT 3.13: installing the cp39-abi3 wheel on 3.11 proves
      # the stable-ABI wheel really spans Python versions.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: wheels

      - name: Install wheel + pytest
        run: |
          pip install pytest
          pip install wheels/*.whl

      # HONEST COVERAGE NOTE: the shared fixture corpus (../test_files,
      # ~280MB) lives outside this repo, and fixture-driven tests skip when
      # it is absent. What runs here is the synthetic-fixture subset
      # (~263 tests: JSON/JSONL/CSV/contract suites — verified locally:
      # 263 passed, 501 skipped, 0 failed without the corpus). That covers
      # import, dispatch, the bytes API and error contracts against the
      # installed wheel; it is NOT the full ~4,900-test fixture suite.
      # Tests are copied out of the repo so Python imports the installed
      # wheel rather than the source tree (which has no compiled _rust).
      - name: Run corpus-independent tests against the installed wheel
        run: |
          mkdir -p "$RUNNER_TEMP/wheeltest"
          cp -r tests "$RUNNER_TEMP/wheeltest/tests"
          cd "$RUNNER_TEMP/wheeltest"
          python -m pytest tests -q

  # ── Test the built wheel on the OLDEST supported interpreter ───────────────
  # 3.9 is the floor declared by `requires-python` and by pyo3's abi3-py39
  # feature. It is tested separately from the 3.11 job above because the
  # failure modes differ: 3.11 proves the stable ABI spans versions, 3.9
  # proves the *Python* sources contain no post-3.9 syntax. Runtime-evaluated
  # PEP 604 unions (`str | None` in a signature, 3.10+) raise TypeError at
  # import on 3.9 and are invisible to every other job here.
  test-linux-py39:
    name: Test wheel (Linux x86_64, Python 3.9 — floor)
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: wheels

      - name: Install wheel + pytest
        run: |
          pip install pytest
          pip install wheels/*.whl

      # Import from a directory that is NOT the repo root, so the installed
      # wheel is what gets imported (the source tree has no compiled _rust).
      - name: Import on 3.9
        run: |
          cd "$RUNNER_TEMP"
          python -c "import sys, py_chunks; print(sys.version); print(py_chunks.__version__); print(len(py_chunks.__all__), 'exported names')"

      # Same corpus-free subset as the 3.11 job — see the honest coverage note
      # there. The fixture-driven tests skip without ../test_files.
      - name: Run corpus-independent tests against the installed wheel
        run: |
          mkdir -p "$RUNNER_TEMP/wheeltest39"
          cp -r tests "$RUNNER_TEMP/wheeltest39/tests"
          cd "$RUNNER_TEMP/wheeltest39"
          python -m pytest tests -q

  # ── Windows x64 ────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64-pc-windows-msvc
          args: --release --out target/wheels

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: target/wheels

  # ── Source distribution ─────────────────────────────────────────────────────
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out target/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: target/wheels

  # ── Publish ─────────────────────────────────────────────────────────────────
  publish:
    needs: [build-macos, build-linux, build-linux-aarch64, build-windows, sdist, test-linux, test-linux-py39]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write   # required for PyPI trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List wheels
        run: ls -lh dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
