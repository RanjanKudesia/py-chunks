[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "py-chunks"
version = "0.4.1"
description = "Rust-backed Python chunking library"
requires-python = ">=3.9"
dependencies = ["pypdfium2"]
license = { text = "MIT" }
readme = "README.md"
keywords = ["chunking", "document", "pdf", "docx", "doc", "xlsx", "csv", "markdown", "rust"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["openpyxl>=3.1"]

[tool.maturin]
python-source = "."
module-name = "py_chunks._rust"
features = ["pyo3/extension-module"]
