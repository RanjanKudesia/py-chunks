[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "py-chunks"
version = "0.6.1"
description = "Parse and chunk 36 document formats for RAG — one compiled Rust engine, zero Python dependencies"
requires-python = ">=3.9"
# No runtime dependencies. The Rust engine ships compiled inside the wheel and
# vendors PDFium through the `liteparse` crate for scanned-page rasterisation,
# so `pypdfium2` was never imported by anything here (TECH_DEBT B3) — it was a
# large binary wheel forced on every install for nothing.
dependencies = []
license = { text = "MIT" }
readme = "README.md"
keywords = ["chunking", "document", "pdf", "docx", "docm", "dotx", "dotm", "doc", "pptx", "potx", "potm", "ppsx", "ppsm", "xlsx", "xls", "xlsm", "xlsb", "ods", "xltx", "xltm", "csv", "tsv", "msg", "outlook", "rtf", "epub", "ebook", "ipynb", "jupyter", "eml", "mbox", "email", "mime", "odt", "odp", "opendocument", "libreoffice", "json", "jsonl", "ndjson", "markdown", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.chunkengine.dev"
Documentation = "https://www.chunkengine.dev/docs"
Repository = "https://github.com/RanjanKudesia/py-chunks"

[project.optional-dependencies]
dev = ["openpyxl>=3.1"]

[tool.maturin]
python-source = "."
module-name = "py_chunks._rust"
features = ["pyo3/extension-module"]
