[package]
name = "py_chunks"
version = "0.1.6"
edition = "2021"

[lib]
name = "py_chunks_rust"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22" }
pythonize = "0.22"
quick-xml = "0.38"
serde_json = "1"
zip = "2"
pdfium-render = { version = "0.8", features = ["sync", "image"] }
calamine = { version = "0.26", features = ["dates"] }
csv = "1"
encoding_rs = "0.8"
cfb = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
