[package]
name = "py_chunks"
version = "0.1.6"
edition = "2021"

[lib]
name = "py_chunks_rust"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
# THE ENGINE. Vendored at crates/rs-chunks so py_chunks builds from a standalone
# clone (PyPI ships from its own repo — no sibling path deps). Never hand-edit
# that tree: ../sync_engine.sh overwrites it from rs-chunks. See
# CONSOLIDATION_PLAN.md.
rs-chunks = { path = "crates/rs-chunks", default-features = false, features = ["pdf-native"] }
pyo3 = { version = "0.22" }
pythonize = "0.22"
quick-xml = "0.38"
serde_json = "1"
zip = "2"
calamine = { version = "0.26", features = ["dates"] }
csv = "1"
encoding_rs = "0.8"
cfb = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
# PDF → markdown via liteparse (heuristic, model-free). OCR/ML features disabled;
# we use only the core spatial-layout markdown path. Async, bridged via a
# current-thread tokio runtime.
liteparse = { version = "=2.9.0", default-features = false }
tokio = { version = "1", features = ["rt"] }
# RTF → text for the .msg RTF-body fallback (MIT, minimal deps). Empirically
# vetted on real Outlook encapsulated-HTML RTF.
rtf-parser = "0.4"
# MIME email (.eml/.mbox) parser: RFC5322/2047, MIME, base64/QP, charsets.
# MIT/Apache. Lean tree (only `hashify` + our existing encoding_rs).
mail-parser = { version = "0.11", default-features = false, features = ["full_encoding"] }
