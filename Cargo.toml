[package]
name = "py_chunks_rust"
version = "0.1.4"
edition = "2021"

[lib]
name = "py_chunks_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
pythonize = "0.22"
quick-xml = "0.38"
serde_json = "1"
zip = "2"
pdf-extract = "0.7"
pdfium-render = { version = "0.8", features = ["sync"] }
