[package]
name = "py_chunks"
version = "0.1.6"
edition = "2021"

[lib]
name = "py_chunks_rust"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
# THE ENGINE. Vendored at crates/rs-chunks so py_chunks builds from a standalone
# clone (PyPI ships from its own repo — no sibling path deps). Never hand-edit
# that tree: ../sync_engine.sh overwrites it from rs-chunks. See
# CONSOLIDATION_PLAN.md.
rs-chunks = { path = "crates/rs-chunks", default-features = false, features = ["pdf-native"] }
pyo3 = { version = "0.22" }
pythonize = "0.22"

# Nothing else. Every parser this package used to name directly — quick-xml,
# zip, calamine, csv, encoding_rs, cfb, base64, image, liteparse, tokio,
# rtf-parser, mail-parser, serde_json — belonged to the engine fork that lived
# in src/extensions/. The fork is gone (CONSOLIDATION_PLAN.md Phase 3), so those
# crates are the vendored engine's dependencies now, declared in its own
# Cargo.toml and pulled in transitively. Re-adding one here means engine logic
# has crept back into the binding: fix that instead.
